<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>César Figueroa Narro | RAL Ventas</title>
  <meta name="description" content="Tarjeta de presentación digital de César Figueroa Narro, Departamento de Ventas RAL.">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="icon" href="assets/logo-ral.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --card: #141416;
      --card-edge: #2a2a2d;
      --red: #e3232b;
      --coral: #f26a52;
      --gray-dark: #3a3a3d;
      --gray: #6e6e72;
      --text: #f4f4f5;
      --muted: #a1a1a6;
      --whatsapp: #25d366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      padding: 32px 16px 48px;
      font-family: "Montserrat", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(227, 35, 43, .18), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(110, 110, 114, .18), transparent 45%),
        var(--bg);
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 380px;
      padding: 44px 32px 36px;
      border-radius: 22px;
      background: linear-gradient(160deg, #1b1b1e 0%, var(--card) 55%, #0e0e10 100%);
      border: 1px solid var(--card-edge);
      box-shadow: 0 30px 60px rgba(0, 0, 0, .6);
      overflow: hidden;
      text-align: center;
    }

    /* Franjas diagonales inspiradas en el logo */
    .card::before,
    .card::after {
      content: "";
      position: absolute;
      left: -20%;
      width: 140%;
      height: 14px;
      transform: skewY(-8deg);
    }
    .card::before {
      top: 0;
      background: linear-gradient(90deg, var(--coral), var(--red));
    }
    .card::after {
      top: 18px;
      height: 10px;
      background: linear-gradient(90deg, var(--gray-dark), var(--gray));
    }

    .logo {
      width: 130px;
      height: auto;
      margin: 18px auto 20px;
      display: block;
      mix-blend-mode: lighten; /* oculta el fondo negro del logo */
    }

    .brand {
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .5em;
      margin-right: -.5em;
      color: var(--muted);
    }

    .divider {
      width: 60px;
      height: 4px;
      margin: 22px auto;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--coral), var(--red));
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .role {
      margin-top: 10px;
      font-size: .8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .2em;
      color: var(--red);
    }

    .phone {
      display: inline-block;
      margin-top: 22px;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
    }
    .phone:hover { color: var(--coral); }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 20px;
      border-radius: 12px;
      font: inherit;
      font-weight: 600;
      font-size: .95rem;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn svg { width: 22px; height: 22px; flex-shrink: 0; }

    .btn-whatsapp {
      background: var(--whatsapp);
      color: #fff;
      box-shadow: 0 10px 24px rgba(37, 211, 102, .25);
    }
    .btn-whatsapp:hover { box-shadow: 0 14px 30px rgba(37, 211, 102, .35); }

    .btn-call {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--gray-dark);
    }
    .btn-call:hover { border-color: var(--red); background: rgba(227, 35, 43, .08); }

    .social {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 26px;
    }
    .social a {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      color: var(--text);
      background: #1f1f22;
      border: 1px solid var(--gray-dark);
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .social a:hover { transform: translateY(-2px); border-color: transparent; }
    .social .fb:hover { background: #1877f2; }
    .social .ig:hover { background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af); }
    .social svg { width: 22px; height: 22px; }

    /* Servicios */
    .services {
      width: 100%;
      max-width: 960px;
    }
    .section-title {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .section-title + .divider { margin: 14px auto 28px; }
    .services h3.section-title { margin-top: 48px; font-size: 1.1rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .service {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--card-edge);
      aspect-ratio: 4 / 3;
    }
    .service img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s ease;
    }
    .service:hover img { transform: scale(1.06); }
    .service figcaption {
      position: absolute;
      inset: auto 0 0 0;
      padding: 36px 14px 12px;
      font-size: .8rem;
      font-weight: 600;
      line-height: 1.3;
      text-transform: uppercase;
      letter-spacing: .04em;
      background: linear-gradient(transparent, rgba(0, 0, 0, .9) 60%);
      border-left: 4px solid var(--red);
    }
    .service figcaption small {
      display: block;
      margin-top: 2px;
      font-size: .7rem;
      font-weight: 400;
      color: var(--muted);
      text-transform: none;
    }

    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .service figcaption { font-size: .68rem; padding: 28px 10px 10px; }
    }

    footer {
      margin-top: 30px;
      font-size: .7rem;
      color: var(--gray);
      letter-spacing: .1em;
    }
  </style>
</head>
